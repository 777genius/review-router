name: Native runtime candidate

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact current Action main commit to qualify against the pinned managed fork release
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-runtime-candidate.yml'
      - 'tools/ocr/**'
      - 'src/codex-oauth/codex-bootstrap.ts'
      - 'src/codex-oauth/ocr-managed-bootstrap.ts'
      - 'src/control-plane/review-agent-profiles.json'
      - 'src/codex-oauth/codex-auth-refresh-validation.ts'
      - 'src/review-orchestration/infrastructure/anthropic-messages-codec.ts'
      - 'scripts/native-ocr/**'
      - '__tests__/unit/github/native-ocr-download.test.ts'
      - '__tests__/unit/github/release-workflow.test.ts'
      - '__tests__/unit/review-orchestration/ocr-managed-bootstrap.test.ts'
      - 'src/control-plane/review-model-dispatch-profile.json'
      - '__tests__/integration/ocr-managed/**'
      - '__tests__/integration/codex-oauth/codex-auth-refresh-real-cli.test.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate manual qualification source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 777genius/review-router
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git ls-remote --exit-code origin refs/heads/main)" = "$EXPECTED_SOURCE_SHA"$'\trefs/heads/main'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: ocr-download
        name: Verify and download pinned managed fork release
        run: node scripts/native-ocr/download.ts "$RUNNER_TEMP/reviewrouter-ocr"
      - name: Fetch immutable official auth helper
        run: |
          mkdir -p "$RUNNER_TEMP/reviewrouter-auth-codex"
          npm pack --ignore-scripts @openai/codex@0.147.0-linux-x64 --pack-destination "$RUNNER_TEMP/reviewrouter-auth-codex"
          tar -xzf "$RUNNER_TEMP/reviewrouter-auth-codex/openai-codex-0.147.0-linux-x64.tgz" -C "$RUNNER_TEMP/reviewrouter-auth-codex"
      - name: Require real binaries against synthetic local wire fixtures
        env:
          TMPDIR: ${{ runner.temp }}
          REVIEWROUTER_OCR_REQUIRED: '1'
          REVIEWROUTER_OCR_BINARY: ${{ runner.temp }}/reviewrouter-ocr/opencodereview-linux-amd64
          REVIEWROUTER_CODEX_AUTH_REQUIRED: '1'
          REVIEWROUTER_CODEX_AUTH_BINARY: ${{ runner.temp }}/reviewrouter-auth-codex/package/vendor/x86_64-unknown-linux-musl/bin/codex
        run: |
          npm test -- --runInBand \
            __tests__/integration/ocr-managed/ocr-managed-real-cli.test.ts \
            __tests__/integration/ocr-managed/ocr-managed-native-anthropic-real-cli.test.ts \
            __tests__/integration/codex-oauth/codex-auth-refresh-real-cli.test.ts
      - name: Preserve consumed native release and its qualification evidence
        if: always() && steps.ocr-download.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-consumer-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/reviewrouter-ocr/
          if-no-files-found: error
          retention-days: 7
