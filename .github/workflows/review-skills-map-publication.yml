name: Temporary verified Skills source map publication

on:
  push:
    branches: [feat/review-skills-20261021]

permissions:
  contents: read

concurrency:
  group: temporary-review-skills-map-publication
  cancel-in-progress: false

jobs:
  publish-verified-map:
    if: >-
      github.repository == '777genius/review-router' &&
      github.ref == 'refs/heads/feat/review-skills-20261021' &&
      startsWith(github.event.head_commit.message, 'chore(skills): restore reviewed source map')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed source and initial artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD:dist/index.js.map)" = 42b8a66893ad209e29cd5faac988830db47b2c1f
          rr_source_index="$RUNNER_TEMP/review-skills-source.index"
          test ! -e "$rr_source_index"
          GIT_INDEX_FILE="$rr_source_index" git read-tree HEAD
          GIT_INDEX_FILE="$rr_source_index" git update-index --force-remove -- dist/index.js.map .github/workflows/review-skills-map-publication.yml
          test "$(GIT_INDEX_FILE="$rr_source_index" git write-tree)" = f7a30259f9da282aee9cc88b168768b9bce6a70b
          rm "$rr_source_index"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.11.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify exact map and reconstructed final tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object dist/index.js.map)" = acecb9e11d4239a573cdfc36b1c8261d7d698871
          git diff --cached --quiet
          test "$(git diff --name-only)" = dist/index.js.map
          test -z "$(git ls-files --others --exclude-standard)"
          git add -- dist/index.js.map
          test "$(git diff --cached --name-only)" = dist/index.js.map
          rr_final_index="$RUNNER_TEMP/review-skills-final.index"
          test ! -e "$rr_final_index"
          GIT_INDEX_FILE="$rr_final_index" git read-tree "$(git write-tree)"
          GIT_INDEX_FILE="$rr_final_index" git update-index --force-remove -- .github/workflows/review-skills-map-publication.yml
          test "$(GIT_INDEX_FILE="$rr_final_index" git write-tree)" = e1e2a331338e02c14d8169819db020872b34a489
          rm "$rr_final_index"
      - name: Commit verified map to this PR branch
        shell: bash
        env:
          RR_PUBLICATION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --cached --name-only)" = dist/index.js.map
          test "$(git rev-parse :dist/index.js.map)" = acecb9e11d4239a573cdfc36b1c8261d7d698871
          git config user.name 'Илия'
          git config user.email 'iliyazelenkog@gmail.com'
          git commit -m 'chore(skills): record verified source map' -m 'Rebuilt from the reviewed source using the normal build; exact map blob and complete final tree verified before publication.'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          rr_authorization="$(printf 'x-access-token:%s' "$RR_PUBLICATION_TOKEN" | base64 -w0)"
          printf '::add-mask::%s\n' "$rr_authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $rr_authorization"
          rr_target_ref=refs/heads/feat/review-skills-20261021
          test "$(git ls-remote --refs origin "$rr_target_ref" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$rr_target_ref"
