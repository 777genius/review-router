name: Regenerate committed artifacts (prepare-license-artifacts)
on:
  push:
    branches: ['legal/apache-2-origin-preserved-20261108']
    paths:
      - '.github/workflows/prepare-license-artifacts.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == '777genius/review-router'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies and rebuild exact source
        run: |
          npm ci
          npm run build
      - name: Commit generated artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -u dist/
          git rm .github/workflows/prepare-license-artifacts.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync exact runtime artifacts with source"
          auth="$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
