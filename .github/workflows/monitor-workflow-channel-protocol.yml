name: Monitor workflow channel protocol compatibility

# Read-only compatibility monitoring for the workflow-v1 channel. This workflow
# never deploys, promotes or rolls back anything: it only fails visibly so the
# existing GitHub notifications surface a drifted or bypassed release chain.
# The schedule interval is not a guaranteed detection time; GitHub may delay runs.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: monitor-workflow-channel-protocol-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout monitoring logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check workflow-v1 against production protocol-info
        run: node scripts/check-workflow-channel-protocol.mjs
