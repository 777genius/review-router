name: Temporary licensing bundle sync
on:
  push:
    branches:
      - legal/apache-2-origin-preserved-20261108
permissions:
  contents: write
jobs:
  sync:
    if: contains(github.event.head_commit.message, 'one-shot license bundle sync')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git restore --worktree -- dist && npm run build
      - name: Commit only regenerated bundles, remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/index.js dist/single-t0-plan.js
          git rm .github/workflows/rebuild-licensing-bundles-temp.yml
          git diff --cached --quiet && exit 1
          git commit -m 'build: sync Apache license metadata in committed runtime bundles'
          git push origin HEAD:legal/apache-2-origin-preserved-20261108
