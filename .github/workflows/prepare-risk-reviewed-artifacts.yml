name: Final risk review bundle parity (one shot)
on:
  push:
    branches: ['feat/risk-aware-review-lite-20261108']
    paths: ['.github/workflows/prepare-risk-reviewed-artifacts.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == '777genius/review-router'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and rebuild exact reviewed source
        run: |
          npm ci
          npm run build
      - name: Commit regenerated files and self-remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -u dist/
          git rm .github/workflows/prepare-risk-reviewed-artifacts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: sync reviewed risk bundles'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
