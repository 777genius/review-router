name: Temporary OCR draft bundle refresh
# One-time rebuild on final scoped source; delete workflow before merge.

on:
  push:
    branches:
      - fix/ocr-native-preview-inventory-20261104
    paths:
      - .github/workflows/ocr-draft-bundle-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          # Use the latest draft head; an older queued run must not write
          # stale generated bundles over more recent source commits.
          ref: fix/ocr-native-preview-inventory-20261104
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Always rebuild against the latest draft head: queued runs may start
      # after another scoped source commit has already landed.
      - name: Rebuild and push Action bundles without force
        run: |
          set -euo pipefail
          git config user.name '777genius'
          git config user.email 'quantjumppro@gmail.com'
          for attempt in 1 2 3; do
            git fetch origin refs/heads/fix/ocr-native-preview-inventory-20261104
            git reset --hard FETCH_HEAD
            npm run build
            git add -- dist
            if git diff --cached --quiet; then
              echo 'Committed bundles already match source.'
              exit 0
            fi
            git commit -m 'build(ocr): synchronize committed Action bundles'
            if git push origin HEAD:refs/heads/fix/ocr-native-preview-inventory-20261104; then
              exit 0
            fi
            echo "Draft advanced during bundle build; regenerating (attempt $attempt)."
          done
          echo 'Draft bundle push lost three races; refusing stale artifact update.' >&2
          exit 1

