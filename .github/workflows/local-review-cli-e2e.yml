name: Local CLI E2E
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/cli/**'
      - 'src/local-review/**'
      - 'src/config/loader.ts'
      - 'bin/mpr'
      - 'scripts/local-review-*'
      - '__tests__/unit/local-review/**'
      - '.github/workflows/local-review-cli-e2e.yml'
permissions:
  contents: read
concurrency:
  group: local-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  local-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - run: npm ci
      - run: npm run build:cli
      - run: node scripts/local-review-package-smoke.cjs
      - run: npm test -- __tests__/unit/local-review --runInBand --testTimeout=20000
      - run: node scripts/local-review-cli-e2e.cjs
