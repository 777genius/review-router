# Read-only validation while this draft awaits main integration.
name: Unified OCR OAuth regression
on:
  push:
    branches: [feat/unified-ocr-review-20261026]
    paths:
      - .github/workflows/unified-ocr-sync-main.yml
      - src/codex-oauth/codex-auth-refresh-validation.ts
      - __tests__/unit/codex-oauth/codex-auth-refresh.test.ts
permissions:
  contents: read
concurrency:
  group: unified-ocr-oauth-regression
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install the committed dependency graph
        run: npm ci
      - name: Check types and lint without changing source
        run: |
          npm run typecheck
          npm run lint
      - name: Fetch the exact official auth-only helper
        run: |
          mkdir -p "$RUNNER_TEMP/reviewrouter-auth-codex"
          npm pack --ignore-scripts @openai/codex@0.147.0-linux-x64 --pack-destination "$RUNNER_TEMP/reviewrouter-auth-codex"
          tar -xzf "$RUNNER_TEMP/reviewrouter-auth-codex/openai-codex-0.147.0-linux-x64.tgz" -C "$RUNNER_TEMP/reviewrouter-auth-codex"
      - name: Test credential custody, writeback order and real auth-only protocol
        env:
          REVIEWROUTER_CODEX_AUTH_REQUIRED: '1'
          REVIEWROUTER_CODEX_AUTH_BINARY: ${{ runner.temp }}/reviewrouter-auth-codex/package/vendor/x86_64-unknown-linux-musl/bin/codex
        run: |
          npm test -- --runInBand \
            __tests__/unit/codex-oauth \
            __tests__/integration/codex-oauth/codex-auth-refresh-real-cli.test.ts \
            --json --outputFile="$RUNNER_TEMP/oauth-regression.json"
      - name: Build all runtime bundles
        run: npm run build
      - name: Summarize observed test results
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path = `${process.env.RUNNER_TEMP}/oauth-regression.json`;
          if (fs.existsSync(path)) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            for (const key of ['success','numTotalTests','numPassedTests','numFailedTests','numPendingTests']) console.log(`${key}=${report[key]}`);
            for (const suite of report.testResults ?? []) for (const test of suite.assertionResults ?? []) if (test.status === 'failed') console.log(test.fullName, test.failureMessages);
          }
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-ocr-oauth-${{ github.sha }}
          path: ${{ runner.temp }}/oauth-regression.json
          retention-days: 7
          if-no-files-found: warn
