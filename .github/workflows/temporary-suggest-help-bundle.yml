# Temporary one-shot bundle reconciliation for Draft PR #378; delete before merge.
name: Suggest help bundle reconciliation (temporary)

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/temporary-suggest-help-bundle.yml

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/interaction-suggest-help-20261108' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact same-repository PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: Restore baseline after install scripts
        run: git restore --worktree -- dist
      - name: Format only changed source and tests
        run: npx prettier --write src/github/interaction.ts __tests__/unit/github/interaction.test.ts
      - name: Rebuild checked-in Action bundle
        run: npm run build
      - name: Verify context gateway release metadata
        run: npm run check:context-gateway-release-metadata
      - name: Commit only tracked generated artifacts and touched source
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- dist src/github/interaction.ts __tests__/unit/github/interaction.test.ts
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "All tracked bundles are coherent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(action): rebuild runtime for suggest-fix help parity"
          git push origin HEAD:refs/heads/fix/interaction-suggest-help-20261108
