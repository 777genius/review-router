name: ReviewRouter Secrets Runtime

on:
  workflow_call:
    inputs:
      api_url:
        type: string
        required: false
        default: https://api.reviewrouter.org
      pr_number:
        type: string
        required: false
        default: ''
    secrets:
      REVIEW_ROUTER_LEDGER_KEY:
        required: false
      REVIEW_THREAD_LIFECYCLE_RESOLVE_TOKEN:
        required: false
      CODEX_AUTH_JSON:
        required: false
      CODEX_CONFIG_TOML:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      MIMO_TOKEN_PLAN_API_KEY:
        required: false

permissions: {}

jobs:
  review:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      REVIEWROUTER_API_URL: ${{ inputs.api_url }}
      REVIEWROUTER_OIDC_AUDIENCE: reviewrouter
      REVIEWROUTER_RUNTIME_CONFIG_MODE: oidc
      REVIEWROUTER_STATIC_CONFIG_FALLBACK: 'false'
      CODEX_AUTH_JSON_PRESENT: ${{ secrets.CODEX_AUTH_JSON != '' && '1' || '0' }}
      CODEX_CONFIG_TOML_PRESENT: ${{ secrets.CODEX_CONFIG_TOML != '' && '1' || '0' }}
      CLAUDE_CODE_OAUTH_TOKEN_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && '1' || '0' }}
      OPENAI_API_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' && '1' || '0' }}
      OPENROUTER_API_KEY_PRESENT: ${{ secrets.OPENROUTER_API_KEY != '' && '1' || '0' }}
      MIMO_TOKEN_PLAN_API_KEY_PRESENT: ${{ secrets.MIMO_TOKEN_PLAN_API_KEY != '' && '1' || '0' }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate immutable producer identity
        shell: bash
        env:
          RR_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RR_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          node --input-type=module-typescript <<'NODE'
          const e = process.env;
          if (e.RR_WORKFLOW_REPOSITORY !== '777genius/review-router' ||
              !/^[a-f0-9]{40}$/.test(e.RR_WORKFLOW_SHA || '') ||
              !/^[1-9][0-9]*$/.test(e.GITHUB_REPOSITORY_ID || ''))
            throw new Error('reviewrouter_producer_identity_invalid');
          NODE
      - name: Checkout pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout immutable producer runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 777genius/review-router
          ref: ${{ job.workflow_sha }}
          path: .reviewrouter-runtime
          persist-credentials: false
      - name: Resolve provider tooling
        id: provider-tooling
        shell: bash
        env:
          REVIEW_ROUTER_MODE: runtime-preflight
        run: node .reviewrouter-runtime/dist/index.js
      - name: Install Codex CLI
        if: ${{ steps.provider-tooling.outputs.codex_cli_needed == 'true' }}
        shell: bash
        run: npm install -g @openai/codex@0.147.0
      - name: Install Claude Code CLI
        if: ${{ steps.provider-tooling.outputs.claude_cli_needed == 'true' }}
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore Codex subscription auth
        if: ${{ steps.provider-tooling.outputs.codex_oauth_needed == 'true' && env.CODEX_AUTH_JSON_PRESENT == '1' }}
        shell: bash
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_CONFIG_TOML: ${{ secrets.CODEX_CONFIG_TOML }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const payload = process.env.CODEX_AUTH_JSON || '';
          const fail = (message) => {
            console.error('::error::' + message);
            process.exit(1);
          };
          const warn = (message) => {
            console.error('::warning::' + message);
          };
          let auth;
          try {
            auth = JSON.parse(payload);
          } catch (error) {
            fail('CODEX_AUTH_JSON is not valid JSON. reseed auth.json from a trusted machine. ' + error.message);
          }
          if (auth.auth_mode !== 'chatgpt') {
            fail('CODEX_AUTH_JSON auth_mode must be chatgpt. reseed auth.json with Codex CLI subscription login or switch this repo to API-key mode.');
          }
          if (!auth.tokens || typeof auth.tokens.refresh_token !== 'string' || auth.tokens.refresh_token.length === 0) {
            fail('CODEX_AUTH_JSON tokens.refresh_token is missing. Run codex login on a trusted machine and reseed auth.json.');
          }
          if (!auth.last_refresh) {
            warn('CODEX_AUTH_JSON last_refresh is missing. If Codex later fails with an auth error, run codex login on a trusted machine and reseed auth.json.');
          }
          NODE
          export CODEX_HOME="${CODEX_HOME:-$HOME/.codex}"
          mkdir -p "$CODEX_HOME"
          chmod 700 "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          if [ -n "${CODEX_CONFIG_TOML:-}" ]; then
            printf '%s' "$CODEX_CONFIG_TOML" > "$CODEX_HOME/config.toml"
            chmod 600 "$CODEX_HOME/config.toml"
          fi

      - name: Run ReviewRouter
        shell: bash
        env:
          REVIEW_ROUTER_MODE: review
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REVIEW_ROUTER_LEDGER_KEY: ${{ secrets.REVIEW_ROUTER_LEDGER_KEY }}
          REVIEW_THREAD_LIFECYCLE_RESOLVE_TOKEN: ${{ secrets.REVIEW_THREAD_LIFECYCLE_RESOLVE_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_CONFIG_TOML: ${{ secrets.CODEX_CONFIG_TOML }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MIMO_TOKEN_PLAN_API_KEY: ${{ secrets.MIMO_TOKEN_PLAN_API_KEY }}
        run: node .reviewrouter-runtime/dist/index.js
