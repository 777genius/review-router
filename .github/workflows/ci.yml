name: CI

on:
  pull_request:
    branches: [main, ts-rewrite]
  push:
    branches: [main, ts-rewrite]
  workflow_dispatch:
    inputs:
      live_mcp:
        description: Exercise real anonymous DeepWiki, Microsoft Learn and Cloudflare MCP through OCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Qualify managed OCR binary
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          tools/ocr/build.sh --out "$RUNNER_TEMP/reviewrouter-ocr"
          diff -u tools/ocr/qualifications/review-skills-v1.manifest "$RUNNER_TEMP/reviewrouter-ocr/MANIFEST"
      - name: Prepare review-quality fixture prerequisites
        timeout-minutes: 5
        run: |
          python3 --version
          docker info
          docker pull postgres:17
      # Run tests with CI-optimized settings:
      # --maxWorkers=2: Limit parallelism to reduce resource contention
      # --detectOpenHandles surfaces lingering async resources
      # Use per-test timeout and open-handle detection to avoid hangs
      - name: Run tests with required managed OCR qualification
        env:
          REVIEWROUTER_OCR_REQUIRED: '1'
          REVIEWROUTER_OCR_BINARY: ${{ runner.temp }}/reviewrouter-ocr/opencodereview
        run: npm run test -- --maxWorkers=2 --detectOpenHandles --testTimeout=20000
      - name: Qualify native OCR MCP invocation and result reuse
        timeout-minutes: 6
        env:
          REVIEWROUTER_TEST_LIVE_MCP: ${{ github.event_name == 'workflow_dispatch' && inputs.live_mcp && '1' || '0' }}
        run: |
          mkdir -p tmp/native-mcp-ci
          curl --fail --silent --show-error --location \
            https://github.com/777genius/review-router/releases/download/ocr-v1.13.1-rr.3/opencodereview-linux-amd64 \
            --output tmp/native-mcp-ci/opencodereview
          echo '2f62d6fbb326e74d0fe9377f0224f1b56520bcefee688c58073fa1a30e45f1c9  tmp/native-mcp-ci/opencodereview' | sha256sum --check --strict
          chmod 700 tmp/native-mcp-ci/opencodereview
          REVIEWROUTER_TEST_APPROVED_OCR_BINARY="$PWD/tmp/native-mcp-ci/opencodereview" \
            npm test -- __tests__/unit/context-tools/ocr-native.test.ts --runInBand
      - run: npm run build
      - name: Verify committed runtime artifacts
        run: |
          npm run check:context-gateway-release-metadata
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
