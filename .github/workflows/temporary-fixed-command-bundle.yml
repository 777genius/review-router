name: Temporary focused command Action bundle refresh

on:
  push:
    branches: [feat/pr-comment-fixed-target-20261107]
    paths:
      - .github/workflows/temporary-fixed-command-bundle.yml

permissions: {}

jobs:
  refresh:
    if: ${{ github.repository == '777genius/review-router' && github.ref == 'refs/heads/feat/pr-comment-fixed-target-20261107' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Rebuild changed interaction bundle only
        run: |
          set -euo pipefail
          npm run build
          git add -- dist/index.js dist/index.js.map
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(action): synchronize fixed command help bundle'
          git push origin HEAD:refs/heads/feat/pr-comment-fixed-target-20261107
